<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="graphics">
    <allow own="io.github.ccontino84.owlfish.Qualcomm"/>
  </policy>
  <!-- The helper itself checks that the caller is lipstick (or root) -->
  <policy context="default">
    <allow send_destination="io.github.ccontino84.owlfish.Qualcomm"
           send_interface="io.github.ccontino84.owlfish.Qualcomm"/>
    <allow send_destination="io.github.ccontino84.owlfish.Qualcomm"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
